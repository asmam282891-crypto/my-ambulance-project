workflows:
  flutter-apk-build:
    name: Flutter Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      android_jdk: 17
      flutter: 3.22.2
    scripts:
      - name: Build Flutter APK
        script: |
          cd $(dirname $(find . -name "main.dart" | head -n 1))/..
          flutter pub get
          flutter build apk --release
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
