workflows:
  flutter-apk-build:
    name: Flutter Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    working_directory: ambulance_app
    environment:
      flutter: stable
    scripts:
      - name: Build Flutter APK
        script: |
          flutter pub get
          flutter build apk --release
    artifacts:
      - ambulance_app/build/app/outputs/flutter-apk/*.apk
